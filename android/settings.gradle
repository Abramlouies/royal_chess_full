pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")

        if (!localPropertiesFile.exists()) {
            throw new GradleException(
                "local.properties is missing. Flutter SDK path cannot be determined."
            )
        }

        localPropertiesFile.withInputStream { properties.load(it) }

        def flutterSdkPath = properties.getProperty("flutter.sdk")

        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            throw new GradleException(
                "flutter.sdk is not set in local.properties."
            )
        }

        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "royal_chess"

include(":app")
